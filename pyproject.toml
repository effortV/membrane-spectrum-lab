[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xps-discovery-agent"
version = "0.3.0"
description = "Evidence-grounded XPS data-mechanism discovery agent for NF/RO membranes"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "plotly>=5.24,<7",
  "pymupdf>=1.24,<2",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "streamlit>=1.63,<2",
  "tenacity>=8.3,<10",
  "typer>=0.12,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "ruff>=0.6,<1", "paramiko>=4,<5"]

[project.scripts]
xps-agent = "xps_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xps_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
